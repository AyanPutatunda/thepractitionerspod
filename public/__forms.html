<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Forms</title>
  </head>
  <body>
    <!-- Static copies so Netlify's build parser can register the forms.
         The React forms POST here. Hidden from navigation. -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <select name="subject">
        <option>General</option>
        <option>Guest Application</option>
        <option>Sponsorship</option>
        <option>Press</option>
        <option>Other</option>
      </select>
      <textarea name="message"></textarea>
      <input type="checkbox" name="consent" value="yes" />
      <input name="bot-field" />
    </form>

    <form name="guest-application" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="guest-application" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="title" />
      <input type="text" name="company" />
      <input type="url" name="linkedin" />
      <textarea name="bio"></textarea>
      <textarea name="topics"></textarea>
      <textarea name="story"></textarea>
      <input type="text" name="availability" />
      <input type="text" name="heard-from" />
      <input type="checkbox" name="consent" value="yes" />
      <input name="bot-field" />
    </form>
  </body>
</html>
