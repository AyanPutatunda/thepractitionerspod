# Netlify Git auto-publish builds this Next.js app.
# The Next.js runtime (OpenNext) is detected from the repo. Do not add a
# GitHub Actions deploy job, and do not point this file at web/.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_PUBLIC_SITE_URL = "https://thepractitionerspod.com"

# Static form skeleton used by Netlify's build-time form parser.
# Submissions POST to /__forms.html so the Next.js runtime does not intercept them.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
