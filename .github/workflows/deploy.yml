name: Build & deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run build # type-checks (astro check) and builds to web/dist

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: web/dist
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Production on pushes to main; preview deploys for PRs from this repo.
    # Forked PRs never see the secrets, so they only get the build check.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
      url: ${{ steps.deploy.outputs.url }}
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
    steps:
      - uses: actions/checkout@v4 # for netlify.toml

      - uses: actions/download-artifact@v4
        with:
          name: site
          path: web/dist

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check Netlify secrets
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ] || [ -z "$NETLIFY_SITE_ID" ]; then
            echo "::error::Add NETLIFY_AUTH_TOKEN and NETLIFY_SITE_ID in Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Deploy to Netlify
        id: deploy
        env:
          # Passed via env (not inlined) so commit messages can't inject shell.
          DEPLOY_MSG: ${{ github.event.head_commit.message || github.event.pull_request.title || 'manual deploy' }}
          ALIAS: pr-${{ github.event.pull_request.number || github.run_number }}
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            FLAGS="--prod"
          else
            FLAGS="--alias $ALIAS"
          fi
          npx --yes netlify-cli@27 deploy \
            --dir "$GITHUB_WORKSPACE/web/dist" \
            --no-build \
            --site "$NETLIFY_SITE_ID" \
            --message "${DEPLOY_MSG:0:200} ($GITHUB_SHA)" \
            $FLAGS --json > deploy.json
          URL=$(node -e "const d=require('./deploy.json'); console.log(d.url || d.deploy_url)")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "### 🚀 Deployed: $URL" >> "$GITHUB_STEP_SUMMARY"
